name: Daily Investment Data Update

on:
  workflow_dispatch:
    inputs:
      financial_backfill:
        description: "財務サマリーを銘柄単位で一括取得する（初回投入や銘柄追加時）"
        type: boolean
        required: false
        default: false

concurrency:
  group: canonical-postgresql-update
  cancel-in-progress: false

permissions:
  contents: read

env:
  DATABASE_URL: "${{ secrets.DATABASE_URL }}"
  GCS_BUCKET: invest-dwh-db-storage
  RAW_DATA_URI: gs://invest-dwh-db-storage/raw

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: "${{ secrets.GCP_CREDENTIALS }}"

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Sync investment target identifiers
        id: sync_identifiers
        if: inputs.financial_backfill
        continue-on-error: true
        env:
          JQUANTS_API_KEY: "${{ secrets.JQUANTS_API_KEY }}"
        run: python backend/scripts/jquants_sync.py master --missing

      - name: Backfill financial disclosures
        id: financial_backfill
        if: inputs.financial_backfill
        continue-on-error: true
        env:
          JQUANTS_API_KEY: "${{ secrets.JQUANTS_API_KEY }}"
        run: python backend/scripts/jquants_sync.py financials

      - name: Sync latest financial disclosures
        id: financial_latest
        if: ${{ !inputs.financial_backfill }}
        continue-on-error: true
        env:
          JQUANTS_API_KEY: "${{ secrets.JQUANTS_API_KEY }}"
        run: python backend/scripts/jquants_sync.py financials --latest

      - name: Report financial sync failures
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for entry in \
            "identifiers:${{ steps.sync_identifiers.outcome }}" \
            "backfill:${{ steps.financial_backfill.outcome }}" \
            "latest:${{ steps.financial_latest.outcome }}"; do
            name="${entry%%:*}"
            outcome="${entry#*:}"
            if [ "${outcome}" = "failure" ]; then
              echo "::warning title=財務同期の失敗::${name} が失敗しました。価格更新は継続します"
              failed=1
            fi
          done
          if [ "${failed}" = "0" ]; then
            echo "財務同期に失敗したステップはありません"
          fi

      - name: Run daily ETL
        env:
          JQUANTS_API_KEY: "${{ secrets.JQUANTS_API_KEY }}"
        run: python backend/scripts/daily_update.py

      - name: Publish immutable raw responses
        run: python backend/scripts/publish_raw.py

      # PostgreSQLが唯一の正本。GCSには復旧用の論理バックアップだけを保存する。
      - name: Create PostgreSQL backup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/backups
          docker run --rm \
            --env DATABASE_URL \
            postgres:17-alpine \
            sh -c 'pg_dump --no-owner --no-privileges "$DATABASE_URL"' \
            | gzip > "data/backups/run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sql.gz"

      - name: Upload immutable backup
        shell: bash
        run: |
          set -euo pipefail
          file="data/backups/run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sql.gz"
          object="gs://${GCS_BUCKET}/postgres-backups/$(date -u +'%Y/%m/%d')/$(basename "${file}")"
          gcloud storage cp "${file}" "${object}" --if-generation-match=0

      - name: Upload short-lived recovery artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-backup-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/backups/*.sql.gz
          if-no-files-found: warn
          retention-days: 7
